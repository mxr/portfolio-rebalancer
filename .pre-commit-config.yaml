repos:
- repo: https://github.com/biomejs/pre-commit
  rev: 94dfd97e59f6fcc5abec3bf328ed6108a82fa760  # frozen: v2.5.7
  hooks:
  - id: biome-check
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: 4380fbb73a154b5f5624794c1c78d9719ccc860f  # frozen: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --line-width=120]
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: end-of-file-fixer
  - id: pretty-format-json
    args: [--autofix]
    exclude: package-lock.json
  - id: trailing-whitespace
- repo: https://github.com/pre-commit/sync-pre-commit-deps
  rev: 497f8ebf9d58162bb5898e3973a633d31d511169  # frozen: v0.0.5
  hooks:
  - id: sync-pre-commit-deps
    args: [--yaml-mapping=2, --yaml-sequence=2, --yaml-offset=0]
- repo: https://github.com/rhysd/actionlint
  rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
  hooks:
  - id: actionlint
    additional_dependencies:
    - github.com/wasilibs/go-shellcheck/cmd/shellcheck@latest
- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: 451b56af716f9f0d0c2b816503a3fd0cf8b036fa  # frozen: v1.29.0
  hooks:
  - id: zizmor
    args: [--no-progress, --fix]
- repo: local
  hooks:
  - id: biome-schema-version
    name: biome schema version
    entry: |-
      python3 -c 'import re, pathlib; cfg = pathlib.Path(".pre-commit-config.yaml").read_text(); ver = re.search(r"biomejs/pre-commit.*?frozen: v([0-9.]+)", cfg, re.S)[1]; p = pathlib.Path("biome.json"); p.write_text(re.sub(r"schemas/[^/]+/schema\.json", f"schemas/{ver}/schema.json", p.read_text()))'
    language: python
    files: ^(biome\.json|\.pre-commit-config\.yaml)$
    pass_filenames: false
